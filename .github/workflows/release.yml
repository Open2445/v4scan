name: Release

# Builds v4scan for all supported targets and publishes a GitHub Release with
# prebuilt binaries. Uses the repository's built-in GITHUB_TOKEN (no external
# secret required) so the Release is created by CI, not by a local `gh` install.
#
# Trigger: push a tag matching v*.*.* (e.g. `git tag v0.1.0 && git push origin v0.1.0`),
# or run manually via workflow_dispatch.
#
# NOTE (untested in CI): windows-gnu uses choco-installed MinGW and a static CRT
# flag so the binary carries no MinGW runtime DLLs (matching the locally staged
# gnu binary). If the windows-gnu job ever fails, the windows-msvc binary still
# covers Windows users; attach the locally-built gnu .exe manually as a fallback.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write   # required to create the GitHub Release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: x86_64-pc-windows-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install MinGW (Windows gnu only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: choco install mingw -y

      - name: Build (Windows gnu — static CRT, no MinGW DLLs)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/v4scan.exe v4scan-${{ matrix.target }}.exe

      - name: Build (all other targets)
        if: matrix.target != 'x86_64-pc-windows-gnu'
        run: |
          cargo build --release --target ${{ matrix.target }}
          $bin = "target/${{ matrix.target }}/release/v4scan"
          if (Test-Path "$bin.exe") { Copy-Item "$bin.exe" "v4scan-${{ matrix.target }}.exe" }
          else { Copy-Item "$bin" "v4scan-${{ matrix.target }}" }
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: v4scan-${{ matrix.target }}
          path: v4scan-${{ matrix.target }}*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release with binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/v4scan-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
